name: Review historical references

on:
  workflow_dispatch:
  push:
    branches:
      - 'closeout/**'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Test source extraction
        run: python3 -m unittest discover -s tests/research
      - name: Read public historical season references
        run: python3 scripts/review-historical-sources.py --output review-results/historical-sources.json
      - name: Classify candidate field evidence without approval
        run: python3 scripts/audit-season-cards.py review-results/historical-sources.json review-results/season-card-audit.json
      - name: Inspect Pages access
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/inspect-pages.mjs review-results/pages-access.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-source-review
          path: review-results/
      - name: Preserve the review for Git-only environments
        if: always()
        shell: bash
        run: |
          test -d review-results
          git switch -c "verification/source-review-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review-results/
          git commit -m "docs: preserve source review for ${GITHUB_SHA}"
          git push origin "HEAD:refs/heads/verification/source-review-${GITHUB_RUN_ID}"
