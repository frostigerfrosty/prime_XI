name: Security analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript, python
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          output: review-results/codeql
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-results
          path: review-results/codeql/
          if-no-files-found: ignore
          retention-days: 7
  report:
    if: always() && github.event_name != 'pull_request'
    needs: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: codeql-results
          path: review-results/codeql/
      - name: Preserve security verification for Git-only environments
        env:
          ANALYSIS_RESULT: ${{ needs.codeql.result }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, readdir, readFile, writeFile } from 'node:fs/promises';
          await mkdir('review-results', { recursive: true });
          const directory = 'review-results/codeql';
          const files = (await readdir(directory).catch(() => [])).filter(name => name.endsWith('.sarif'));
          const alerts = [];
          for (const file of files) {
            const sarif = JSON.parse(await readFile(`${directory}/${file}`, 'utf8'));
            for (const run of sarif.runs ?? [])
              for (const result of run.results ?? [])
                alerts.push({ file, ruleId: result.ruleId, level: result.level, locations: result.locations });
          }
          const summary = {
            commit: process.env.GITHUB_SHA,
            checkedAt: new Date().toISOString(),
            runUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            analysis: process.env.ANALYSIS_RESULT,
            reports: files,
            alerts,
          };
          await writeFile('review-results/security.json', JSON.stringify(summary, null, 2) + '\n');
          NODE
          git switch -c "verification/security-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review-results/security.json
          git commit -m "docs: preserve security analysis for ${GITHUB_SHA}"
          git push origin "HEAD:refs/heads/verification/security-${GITHUB_RUN_ID}"
