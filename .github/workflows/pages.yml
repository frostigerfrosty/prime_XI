name: Publish PRIME XI preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'preview-v*'
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'data/research/**'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run security:audit
      - run: npm run check
      - run: python3 -m unittest discover -s tests/research
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Configure workflow publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/inspect-pages.mjs review-results/pages-configuration.json --enable
      - name: Deploy development preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify the published website
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3; do
            if node scripts/check-site.mjs "$SITE_URL" review-results/published-site.json; then
              exit 0
            fi
            sleep "$((attempt * 5))"
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-verification
          path: review-results/
  report:
    if: always()
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: release-verification
          path: review-results/
      - name: Record deployment outcome
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          await mkdir('review-results', { recursive: true });
          const result = {
            commit: process.env.GITHUB_SHA,
            checkedAt: new Date().toISOString(),
            runUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            build: process.env.BUILD_RESULT,
            deployment: process.env.DEPLOY_RESULT,
            pageUrl: process.env.PAGE_URL || null,
          };
          await writeFile('review-results/release.json', JSON.stringify(result, null, 2) + '\n');
          NODE
          git switch -c "verification/pages-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review-results/
          git commit -m "docs: preserve release verification for ${GITHUB_SHA}"
          git push origin "HEAD:refs/heads/verification/pages-${GITHUB_RUN_ID}"
